name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cxx || 'apple-clang' }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, build_type: Debug,   cc: gcc-13,    cxx: g++-13 }
          - { os: ubuntu-24.04, build_type: Release, cc: gcc-13,    cxx: g++-13 }
          - { os: ubuntu-24.04, build_type: Debug,   cc: clang-18,  cxx: clang++-18 }
          - { os: ubuntu-24.04, build_type: Release, cc: clang-18,  cxx: clang++-18 }
          # macos-15+: macos-14's Xcode 15 libc++ predates std::atomic_ref (the
          # telemetry substrate's writer primitive; upstream libc++ shipped it in
          # LLVM 19), caught by CI 2026-06.
          - { os: macos-15,     build_type: Debug }
          - { os: macos-15,     build_type: Release }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: install clang-18 (linux)
        if: startsWith(matrix.cxx, 'clang')
        run: sudo apt-get update && sudo apt-get install -y clang-18

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install conan
        # conan-center serves recent recipes (fmt/11.2.0, quill/11.1.0, ...) only
        # to recent clients; too old a pin gets "not found in remotes". Bump this
        # periodically — an old pin fights conan-center, not the other way round.
        run: pip install 'conan==2.28.*'

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ccache-${{ matrix.os }}-${{ matrix.cxx || 'apple-clang' }}-${{ matrix.build_type }}

      - name: conan profile
        run: |
          conan profile detect --force
          # The codebase is C++23; bump cppstd in the detected profile.
          sed -i.bak 's/^compiler.cppstd=.*/compiler.cppstd=gnu23/' ~/.conan2/profiles/default
          conan profile show

      - name: cache conan home
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ matrix.os }}-${{ matrix.cxx || 'apple-clang' }}-${{ matrix.build_type }}-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            conan-${{ matrix.os }}-${{ matrix.cxx || 'apple-clang' }}-${{ matrix.build_type }}-

      - name: conan install
        run: conan install . -s build_type=${{ matrix.build_type }} --build=missing

      - name: configure
        run: cmake --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} -DUFW_USE_CCACHE=ON

      - name: build
        run: cmake --build --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} -j

      - name: unit tests
        run: cmake --build --preset conan-${{ matrix.build_type == 'Debug' && 'debug' || 'release' }} --target unit-test
