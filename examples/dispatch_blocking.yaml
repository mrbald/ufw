---
# Dispatch sandbox, flavour 1: SINGLE-THREADED BLOCKING — one worker that is the
# dispatcher AND the classic asio reactor (parks in run_one between rounds). All
# sends resolve to DIRECT calls; zero rings exist.
application:

  workers:
    - id: 0
      loop: blocking

  entities:
    - name: LOGGER
      config:
        severity: info
        pattern: "%(time) | %(log_level:<7) | %(thread_id) | %(logger) - %(message)"
        timestamp_pattern: "%H:%M:%S.%Qms"

    - name: dispatch_lib
      loader_ref: LIBRARY
      config:
        filename: libdispatch_example.dylib
        # filename: libdispatch_example.so

    - name: ping
      loader_ref: PLUGIN
      config:
        library_ref: dispatch_lib
        constructor: pinger_ctor

    - name: pong
      loader_ref: PLUGIN
      config:
        library_ref: dispatch_lib
        constructor: ponger_ctor
...
